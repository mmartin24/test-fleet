defaultNamespace: default
helm:
  chart: config-chart
  values:
    name: one
    extra: testvalue
    # new-tests: bumped per wave by lib/gitrepo-commits.sh's push_image_bump,
    # to force a real rolling pod restart across all target clusters instead
    # of a no-op ConfigMap tweak.
    image: nginx:1.27
rolloutStrategy:
  maxUnavailable: 100%
  autoPartitionSize: 20%
