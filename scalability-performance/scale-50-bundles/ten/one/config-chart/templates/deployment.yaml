apiVersion: apps/v1
kind: Deployment
metadata:
  name: race-test-{{ .Values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: race-test-{{ .Values.name }}
  template:
    metadata:
      labels:
        app: race-test-{{ .Values.name }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.image }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 1
            successThreshold: 1
